name: Build magiskboot

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: android-ndk/ndk-setup@v1
        with:
          ndk-version: r25c  # 可根据项目需求调整 NDK 版本
          add-to-path: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc g++ libssl-dev

      - name: Build magiskboot
        run: |
          # 尝试检测构建系统，优先使用 ndk-build
          if [ -f "Android.mk" ] || [ -f "jni/Android.mk" ]; then
            echo "Using ndk-build"
            ndk-build -j$(nproc)
          elif [ -f "CMakeLists.txt" ]; then
            echo "Using CMake"
            mkdir -p build && cd build
            cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                  -DANDROID_ABI=arm64-v8a \
                  -DANDROID_PLATFORM=android-23 \
                  ..
            make -j$(nproc)
          elif [ -f "Makefile" ]; then
            echo "Using Makefile"
            make -j$(nproc) \
              CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang \
              CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang++ \
              AR=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar \
              LD=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/ld.lld \
              STRIP=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          else
            echo "No recognized build system found"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: magiskboot-binary
          path: |
            magiskboot
            **/magiskboot
            **/*.so
            **/*.a
          if-no-files-found: warn
