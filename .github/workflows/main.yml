name: Build MagiskBoot

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup MSYS2 / MinGW64 GCC
      uses: msys2/setup-msys2@v2
      with:
        msystem: mingw64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-binutils
          make
          git

    - name: Fix libnt pointer type warning
      run: |
        # 修复 SymGetLineFromAddr64 参数类型，消除指针不兼容警告
        sed -i 's/DWORD64 dldisp/DWORD dldisp/g' libnt/libnt.c

    - name: Build
      run: |
        mingw32-make

    - name: Collect artifacts
      run: |
        mkdir -p release
        cp out/magiskboot.exe release/

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: magiskboot-windows-x64
        path: release/*

    - name: Create release on tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: release/*
        generate_release_notes: true
